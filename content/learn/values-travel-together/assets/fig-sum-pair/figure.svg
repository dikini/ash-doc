<title id="title">sum_pair: one pair input, one integer result</title><desc id="desc">Two adjoining blue squares share one rectangular outer contour. An internal seam distinguishes the two Int components of one tuple input. A right-pointing arrow leads to a separate square of the same blue for the Int result. Color denotes type, not value identity. This is not a storage diagram.</desc>
