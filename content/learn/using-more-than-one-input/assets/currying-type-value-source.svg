  <text x="140" y="35" font-family="DejaVu Sans Mono, monospace" font-size="30" text-anchor="middle" fill="#222222">:</text>
  <text x="210" y="35" font-family="DejaVu Sans Mono, monospace" font-size="30" text-anchor="middle" fill="#285f94">Int</text>
  <text x="265" y="35" font-family="DejaVu Sans Mono, monospace" font-size="30" text-anchor="middle" fill="#222222">→</text>
  <text x="320" y="35" font-family="DejaVu Sans Mono, monospace" font-size="30" text-anchor="middle" fill="#285f94">Int</text>
  <text x="380" y="35" font-family="DejaVu Sans Mono, monospace" font-size="30" text-anchor="middle" fill="#222222">→</text>
  <text x="440" y="35" font-family="DejaVu Sans Mono, monospace" font-size="30" text-anchor="middle" fill="#285f94">Int</text>
