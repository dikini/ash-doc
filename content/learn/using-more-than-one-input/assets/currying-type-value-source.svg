<svg xmlns="http://www.w3.org/2000/svg" width="480" height="182" viewBox="0 0 480 182" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Function application with types and values</title>
  <desc id="figure-description">The upper halves show types: red for function, blue for Int. Lower halves identify add in rose, 20 in gold, 22 in violet, and 42 in green. Labels identify values without relying on color. Lower-row arrows are schematic application guides, not conversions between integers.</desc>
