<title id="title">Right-left rewiring</title>
<desc id="description">Before above: black yellow above a red violet right child, whose left child is red blue. After below: red blue above black yellow and black violet. The green, orange, pink, and cyan subtrees retain their left-to-right order. The upper semicircle records Red or Black; the lower color tracks the association.</desc>
